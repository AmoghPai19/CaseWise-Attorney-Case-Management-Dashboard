server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets normally, but fall back to index.html for any
    # route the server doesn't recognize -- required for React Router's
    # client-side routes (e.g. /cases/123) to work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html is never hashed
    # so it's excluded to make sure new deploys are picked up immediately.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}