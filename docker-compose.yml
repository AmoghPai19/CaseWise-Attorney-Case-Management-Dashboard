services:
  mongo:
    image: mongo:7
    container_name: casewise-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: casewise-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Points at the "mongo" service above by its service name -- Docker's
      # internal DNS resolves that to the container's IP on the shared network.
      # Override in your root .env to point at Atlas instead if you prefer.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/casewise}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      - mongo
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static build at build time -- see frontend/Dockerfile.
        # Browser calls to this happen from the HOST machine, so it must be
        # localhost:5000, not the internal "backend" service name.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: casewise-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads-data: